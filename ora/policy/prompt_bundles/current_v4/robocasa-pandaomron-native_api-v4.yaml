schema: ora.prompt-bundle-authoring.v1
bundle_id: direct_v4_robocasa_native_api_v1
status: draft
runtime:
  policy_kind: native_api
  context_schema: ora.policy-context.v3
  provider_scaffold: none
layers:
  planner:
    sources:
    - ora/policy/planners/native/policy-v5.md
    delivery: system
  core:
    sources:
    - ora/policy/core/evidence-action-loop-v8.md
    delivery: project_instructions
  environment:
    source: ora/policy/environments/robocasa/boundary-v1.md
    delivery: project_instructions
  embodiment:
    source: ora/policy/embodiments/panda-omron/manual-public-geometry-v2.md
    format: prompt_bundle_embodiment_v1
    descriptor: ora/policy/embodiments/panda-omron/descriptor-public-geometry-v2.json
    control_profile: null
    delivery: project_instructions
  episode_task:
    source: ora/policy/prompt_bundles/templates/episode-task-v2.md
    placeholder: '{{TASK}}'
    delivery: first_user_message
  tool_manual:
    sources:
    - ora/policy/prompt_bundles/templates/tool-schema-delivery-v1.md
    delivery: manifest_only
    reader_tool: null
  tool_surface:
    profile: robocasa_mobile_direct_v1
    delivery: provider_tools_field
  dynamic_runtime:
    owner: ora
    delivery: current_user_tail
bindings:
  environment_prompt_profile:
    profile_id: robocasa_public_direct_v1
    public_environment_context:
      schema: ora.public-environment-context.v1
      environment_id: robocasa
      embodiment_id: panda_omron
      robot_models:
      - PandaOmron
      controller: JOINT_POSITION_IK_PATH+BASE_VELOCITY_SERVO
      public_cameras:
      - agentview
      - wrist
ownership:
  environment_terms:
  - RoboCasa
  - RoboCasa365
  embodiment_terms:
  - PandaOmron
  - Panda
